[project]
name = "agentic-interview-prep-guide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soumyajit Choudhury", email = "choudhurysoumyajit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "google>=3.0.0",
    "google-generativeai>=0.8.6",
    "graphviz>=0.21",
    "google-genai>=1.0.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.2",
    "openai>=1.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.32.0",
    "streamlit>=1.64.0",
    "tavily-python>=0.8.4",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
agentic-interview-prep-guide = "agentic_interview_prep_guide:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
